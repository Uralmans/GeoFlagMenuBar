<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="22.5" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <!-- Flag circle -->
  <circle cx="180" cy="150" r="86" fill="#0b1120" stroke="url(#accent)" stroke-width="5"/>
  <text x="180" y="150" text-anchor="middle" dominant-baseline="central" font-size="96" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"><</text>
  <!-- Title -->
  <text x="310" y="125" fill="#f1f5f9" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1">GeoFlagMenuBar</text>
  <text x="310" y="185" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400">Real country of your traffic, right in the macOS menu bar</text>
  <!-- Pills -->
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="310" y="218" width="150" height="40" rx="20" fill="#1d4ed8" opacity="0.85"/>
    <text x="385" y="243" text-anchor="middle" fill="#eff6ff">Swift · AppKit</text>
    <rect x="474" y="218" width="128" height="40" rx="20" fill="#15803d" opacity="0.85"/>
    <text x="538" y="243" text-anchor="middle" fill="#f0fdf4">Universal</text>
    <rect x="616" y="218" width="158" height="40" rx="20" fill="#b45309" opacity="0.85"/>
    <text x="695" y="243" text-anchor="middle" fill="#fffbeb">Zero deps</text>
  </g>
</svg>
